# docker compose -f deploy/compose.yaml up -d --build
# Reads secrets from ../.env (same keys as .env.example). Full steps: docs/deploying.md
services:
  listener:
    build: ..
    env_file: ../.env
    environment:
      # Overrides any DATA_DIR in .env so state always lands on the volume.
      DATA_DIR: /app/data
    volumes:
      - listener-data:/app/data
    restart: unless-stopped
    # The listener needs up to 15s to cancel pending approvals and close sessions.
    stop_grace_period: 30s
    # No ports: the bot only makes outbound connections. The image HEALTHCHECK
    # probes /healthz from inside the container.

volumes:
  listener-data:
