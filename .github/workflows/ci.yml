name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Dependencies install with npm: bun 1.3.14's resolver segfaults on this graph.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: bun test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: letta-discord-listener:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Without credentials the listener must exit non-zero with a config error,
      # which proves the image starts Bun and loads the app.
      - name: Smoke-test image
        run: |
          set +e
          out=$(docker run --rm letta-discord-listener:ci 2>&1)
          code=$?
          echo "$out"
          [ "$code" -ne 0 ] && echo "$out" | grep -q "DISCORD_BOT_TOKEN"
